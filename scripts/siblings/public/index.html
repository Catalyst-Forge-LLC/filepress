<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>FilePress siblings</title>
		<link rel="icon" href="/logo.svg" />
		<link rel="stylesheet" href="/styles.css" />
	</head>
	<body>
		<header class="band">
			<span class="brand">
				<img src="/logo.svg" alt="" width="26" height="30" />
				<span class="wordmark">FilePress</span>
				<span class="sub">Siblings</span>
			</span>
			<button type="button" class="band-link" id="workspace" title="Copy workspace path">—</button>
			<span class="band-spacer"></span>
			<span class="strip" id="engine">
				<span class="strip-item"><em>local</em> <b>…</b></span>
			</span>
		</header>

		<main class="body">
			<p class="banner hidden" id="banner"></p>

			<section class="toolbar">
				<div class="group">
					<span class="group-label">Read</span>
					<button type="button" id="refresh">Refresh</button>
					<button type="button" id="plan">Plan</button>
				</div>
				<div class="group group-write">
					<span class="group-label">Write</span>
					<button type="button" class="btn-write" id="apply" disabled>Apply</button>
					<button type="button" class="btn-write" id="ship" disabled>Ship</button>
					<label class="check"><input type="checkbox" id="commit" checked /> commit</label>
				</div>
				<div class="chips" id="chips"></div>
			</section>

			<p class="busy hidden" id="busy"></p>
			<p class="err hidden" id="error"></p>

			<section class="card">
				<table>
					<thead>
						<tr>
							<th class="pick"><input type="checkbox" id="all" aria-label="Select all" /></th>
							<th>Site</th>
							<th>Pin</th>
							<th>Locked</th>
							<th>Update</th>
							<th>Headers</th>
							<th>Git</th>
							<th class="num">Dev</th>
							<th>Live</th>
						</tr>
					</thead>
					<tbody id="rows"></tbody>
				</table>
				<p class="empty hidden" id="empty">No sibling folders depend on getfilepress.</p>
			</section>

			<section class="log-panel">
				<div class="log-head">
					<h2>Activity</h2>
					<span class="muted" id="job-meta">No job yet.</span>
					<span class="log-spacer"></span>
					<button type="button" class="ghost" id="clear-log">Clear</button>
				</div>
				<pre id="log" aria-live="polite"></pre>
			</section>
		</main>

		<footer class="band band-foot">
			<span id="scan-meta">—</span>
			<span class="band-spacer"></span>
			<span>Local operator tool · writes siblings, never pushes</span>
		</footer>

		<script type="module" src="/app.js"></script>
	</body>
</html>
