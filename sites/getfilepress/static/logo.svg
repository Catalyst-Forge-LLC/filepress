<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FilePress">
  <title>FilePress</title>
  <!-- Letterpress screw press stamping digital files -->
  <rect width="64" height="64" rx="14" fill="#0f5c4c"/>

  <!-- Handwheel -->
  <circle cx="32" cy="11" r="6.2" fill="none" stroke="#6dbaa8" stroke-width="2.4"/>
  <circle cx="32" cy="11" r="2" fill="#f6f4ef"/>
  <path d="M32 6.2v2.4M32 13.4v2.4M27.2 11h2.4M34.4 11h2.4" stroke="#f6f4ef" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Lead screw -->
  <rect x="30.4" y="14.5" width="3.2" height="11" rx="1" fill="#6dbaa8"/>

  <!-- Top beam + uprights (book press frame) -->
  <path fill="#f6f4ef" d="M15 17h34a2 2 0 0 1 2 2v3.2H13V19a2 2 0 0 1 2-2z"/>
  <rect x="15.5" y="22" width="4.2" height="28" rx="1.4" fill="#f6f4ef"/>
  <rect x="44.3" y="22" width="4.2" height="28" rx="1.4" fill="#f6f4ef"/>

  <!-- Platen -->
  <rect x="21" y="26.5" width="22" height="4.8" rx="1.4" fill="#f6f4ef"/>
  <rect x="23" y="31" width="18" height="1.8" rx="0.8" fill="#6dbaa8"/>

  <!-- Press bed -->
  <rect x="13.5" y="49.5" width="37" height="3.2" rx="1.2" fill="#f6f4ef"/>

  <!-- File stack under the platen -->
  <g>
    <!-- Rear file -->
    <path fill="#9ec4b8" d="M26 34.2h12.2l3.4 3.4v9.2H26z"/>
    <path fill="#7aaf9f" d="M38.2 34.2v3.4H41.6z"/>
    <!-- Front file -->
    <path fill="#f6f4ef" d="M23 36.8h13.5l4 4V50H23z"/>
    <path fill="#d5e5df" d="M36.5 36.8V40.8H40.5z"/>
    <!-- Document lines -->
    <path stroke="#0f5c4c" stroke-width="1.45" stroke-linecap="round" opacity="0.5"
      d="M26 42.2h8.5M26 45h11M26 47.8h6.5"/>
  </g>
</svg>
